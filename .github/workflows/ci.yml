name: ci

# Pushes to main are built, tested and released by release.yml; this covers
# pull requests, plus the lint that a release should not wait for.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make all

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  release-config:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Runs the action from this checkout against the latest published binary.
  action:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          path: testdata/charts/good
          upload-sarif: "false"
